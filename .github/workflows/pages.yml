name: deploy_pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "models.html"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/docs

          cp index.html _site/index.html
          cp models.html _site/models.html

          if [ -f README.md ]; then cp README.md _site/README.md; fi
          if [ -f LICENSE ]; then cp LICENSE _site/LICENSE; fi
          if [ -d docs ]; then cp -R docs/. _site/docs/; fi

          touch _site/.nojekyll

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
